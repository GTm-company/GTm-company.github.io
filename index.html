<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Gtm-company and Gold_naget</title>
    
    <link rel="canonical" href="https://gtm-company.github.io/">
    <meta name="description" content="Gtm-company and Gold_naget">
    <meta name="theme-color" content="#1F1600">
    <meta name="color-scheme" content="dark">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gtm-company.github.io/">
    <meta property="og:title" content="Gtm-company and Gold_naget">
    <meta property="og:description" content="Gtm-company and Gold_naget">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23261B00'/><text x='50%' y='66%' font-size='56' font-weight='bold' fill='%23F4C430' text-anchor='middle'>G</text></svg>">

    <style>
        :root {
            --bg-dark: #160F00;
            --bg-mid: #3A2800;
            --gold-main: #F4C430;
            --gold-light: #FFE27A;
            --gold-dim: rgba(244, 196, 48, 0.65);
            --glass-bg: rgba(34, 24, 2, 0.58);
            --glass-border: rgba(244, 196, 48, 0.26);
            --glow-strong: rgba(244, 196, 48, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--gold-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            background:
                radial-gradient(circle at 50% 22%, rgba(244, 196, 48, 0.22) 0%, rgba(102, 73, 0, 0.18) 38%, transparent 72%),
                radial-gradient(circle at 50% 85%, rgba(244, 196, 48, 0.12) 0%, transparent 60%),
                linear-gradient(160deg, #120C00 0%, #2B1E00 50%, #140E00 100%);
        }

        #ambient-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .hero-header {
            position: absolute;
            top: 25vh;
            top: 25dvh;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            width: 92%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .brand-main {
            font-size: clamp(2.35rem, 9.5vw, 4.7rem);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -0.025em;
            background: linear-gradient(180deg, #FFF0A8 0%, #F4C430 55%, #C99700 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 22px rgba(244, 196, 48, 0.32));
        }

        .brand-connector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin: 0.35rem 0 0.25rem;
            width: 100%;
            max-width: 240px;
        }

        .brand-connector::before,
        .brand-connector::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(244, 196, 48, 0.45), transparent);
        }

        .brand-connector span {
            font-size: clamp(0.85rem, 2.8vw, 1.15rem);
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: lowercase;
            color: var(--gold-dim);
        }

        .brand-sub {
            font-size: clamp(1.55rem, 6.8vw, 3.1rem);
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -0.01em;
            color: var(--gold-main);
            text-shadow: 0 0 18px rgba(244, 196, 48, 0.25);
        }

        .action-zone {
            position: absolute;
            top: 63vh;
            top: 63dvh;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            width: 90%;
            max-width: 400px;
            padding: 1.25rem;
            border-radius: 24px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 235, 160, 0.15);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            justify-content: center;
        }

        .btn-continue {
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            width: 100%;
            padding: 1.05rem 1.75rem;
            font-size: clamp(1rem, 4vw, 1.2rem);
            font-weight: 800;
            color: #211600;
            background: linear-gradient(135deg, #FFE074 0%, #F4C430 55%, #DDA808 100%);
            border: 1px solid rgba(255, 245, 195, 0.65);
            border-radius: 16px;
            text-decoration: none;
            box-shadow: 0 10px 28px rgba(244, 196, 48, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            cursor: pointer;
            text-align: center;
        }

        .btn-continue:hover {
            transform: translateY(-2px);
            filter: brightness(1.06);
            box-shadow: 0 14px 34px rgba(244, 196, 48, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.65);
        }

        .btn-continue:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-arrow {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .btn-continue:hover .btn-arrow {
            transform: translateX(3px);
        }
    </style>
</head>
<body>

    <canvas id="ambient-canvas"></canvas>

    <header class="hero-header">
        <h1 class="brand-main">Gtm-company</h1>
        <div class="brand-connector"><span>and</span></div>
        <h2 class="brand-sub">Gold_naget</h2>
    </header>

    <main class="action-zone">
        <a href="https://gtm-company.github.io/all" class="btn-continue">
            <span>нажми чтобы продолжить</span>
            <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14"/>
                <path d="M13 5l7 7-7 7"/>
            </svg>
        </a>
    </main>

    <script>
        const canvas = document.getElementById('ambient-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.4 + 0.8;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3 - 0.16;
                this.opacity = Math.random() * 0.55 + 0.18;
                this.fadeSpeed = 0.0025 + Math.random() * 0.0035;
                this.fadingIn = Math.random() > 0.5;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.fadingIn) {
                    this.opacity += this.fadeSpeed;
                    if (this.opacity >= 0.8) this.fadingIn = false;
                } else {
                    this.opacity -= this.fadeSpeed;
                    if (this.opacity <= 0.1) this.fadingIn = true;
                }

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.save();
                ctx.shadowColor = 'rgba(244, 196, 48, 0.6)';
                ctx.shadowBlur = 8;
                ctx.fillStyle = `rgba(255, 215, 85, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.floor((canvas.width * canvas.height) / 17000);
            const clampedCount = Math.min(Math.max(count, 22), 75);
            for (let i = 0; i < clampedCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            animationFrameId = requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            cancelAnimationFrame(animationFrameId);
            resizeCanvas();
            animate();
        });

        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            animate();
        });
    </script>
</body>
</html>
