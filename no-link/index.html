<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Ссылка выключена - Gold_naget &amp; GTm-company</title>
    <link rel="canonical" href="https://gtm-company.github.io/no-link">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0B0706">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231C120C'/><text x='50%' y='66%' font-size='56' font-weight='bold' fill='%23FDE68A' text-anchor='middle'>G</text></svg>">
    <link rel="stylesheet" href="/style.css">
    <style>
        .notice-card {
            padding: 2.35rem 1.5rem 2rem;
            align-items: center;
            text-align: center;
            gap: 1.25rem;
        }

        .status-badge {
            width: 62px;
            height: 62px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.22) 0%, rgba(180, 83, 9, 0.14) 100%);
            border: 1px solid rgba(253, 224, 171, 0.34);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 251, 235, 0.25);
            color: #FDE68A;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notice-divider {
            width: 64%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(253, 224, 171, 0.38), transparent);
        }

        .notice-message {
            font-size: clamp(1.18rem, 4.6vw, 1.38rem);
            font-weight: 800;
            line-height: 1.42;
            letter-spacing: -0.01em;
            text-wrap: balance;
            background: linear-gradient(180deg, #FFFBEB 0%, #FDE68A 62%, #F59E0B 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 2px 12px rgba(0, 0, 0, 0.45));
            padding: 0 0.25rem;
        }
    </style>
</head>
<body>

    <main class="bio-card notice-card">
        <div class="status-badge" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                <line x1="2" y1="2" x2="22" y2="22"/>
            </svg>
        </div>

        <div class="notice-divider" aria-hidden="true"></div>

        <h1 class="notice-message">Извините, но в данный момент ссылка выключена</h1>

        <a href="https://gtm-company.github.io/" id="goBackBtn" class="nav-back">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5"/>
                <path d="M12 19l-7-7 7-7"/>
            </svg>
            <span>Вернуться назад</span>
        </a>
    </main>

    <script>
        document.getElementById("goBackBtn").addEventListener("click", (e) => {
            if (window.history.length > 1 && document.referrer.includes("gtm-company.github.io")) {
                e.preventDefault();
                window.history.back();
            }
        });
    </script>
</body>
</html>
