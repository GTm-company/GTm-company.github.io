<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Gtm-company and Gold_naget - Разделы</title>
    
    <link rel="canonical" href="https://gtm-company.github.io/all">
    <meta name="description" content="Gtm-company and Gold_naget - Разделы">
    <meta name="theme-color" content="#1F1600">
    <meta name="color-scheme" content="dark">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23261B00'/><text x='50%' y='66%' font-size='56' font-weight='bold' fill='%23F4C430' text-anchor='middle'>G</text></svg>">

    <style>
        :root {
            --bg-dark: #160F00;
            --gold-main: #F4C430;
            --gold-dim: rgba(244, 196, 48, 0.72);
            --glass-bg: rgba(34, 24, 2, 0.62);
            --glass-border: rgba(244, 196, 48, 0.26);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--gold-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            background:
                radial-gradient(circle at 50% 30%, rgba(244, 196, 48, 0.2) 0%, rgba(102, 73, 0, 0.16) 42%, transparent 74%),
                linear-gradient(160deg, #120C00 0%, #2B1E00 50%, #140E00 100%);
        }

        #ambient-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .glass-card {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 420px;
            padding: 1.75rem 1.4rem;
            border-radius: 26px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: 0 24px 55px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 235, 160, 0.16);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            gap: 1.15rem;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            width: 100%;
            padding: 1.1rem 1.5rem;
            font-size: 1.12rem;
            font-weight: 800;
            border-radius: 16px;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            cursor: pointer;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .action-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .btn-youtube {
            background: linear-gradient(135deg, #D91E18 0%, #B30000 58%, #850000 100%);
            color: #FFFFFF;
            border: 1px solid rgba(255, 150, 150, 0.32);
            box-shadow: 0 10px 26px rgba(185, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .btn-youtube:hover {
            box-shadow: 0 14px 32px rgba(210, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }

        .btn-net {
            background: linear-gradient(135deg, #0EA5E9 0%, #0284C7 55%, #0369A1 100%);
            color: #FFFFFF;
            border: 1px solid rgba(186, 230, 253, 0.42);
            box-shadow: 0 10px 26px rgba(2, 132, 199, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.32);
        }

        .btn-net:hover {
            box-shadow: 0 14px 32px rgba(14, 165, 233, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.42);
        }

        .back-link {
            margin-top: 0.2rem;
            align-self: center;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--gold-dim);
            text-decoration: none;
            padding: 0.35rem 0.75rem;
            border-radius: 10px;
            transition: color 0.18s ease, background-color 0.18s ease;
        }

        .back-link:hover {
            color: var(--gold-main);
            background-color: rgba(244, 196, 48, 0.1);
        }
    </style>
</head>
<body>

    <canvas id="ambient-canvas"></canvas>

    <main class="glass-card">
        <a href="https://www.youtube.com/@Gold_naget" target="_blank" rel="noopener noreferrer" class="action-btn btn-youtube">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            <span>Youtube</span>
        </a>

        <a href="https://gtm-company.github.io/all/net" class="action-btn btn-net">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
            </svg>
            <span>Ускоритель интернета</span>
        </a>

        <a href="https://gtm-company.github.io/" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5"/>
                <path d="M12 19l-7-7 7-7"/>
            </svg>
            <span>На главную</span>
        </a>
    </main>

    <script>
        const canvas = document.getElementById('ambient-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.4 + 0.8;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3 - 0.16;
                this.opacity = Math.random() * 0.55 + 0.18;
                this.fadeSpeed = 0.0025 + Math.random() * 0.0035;
                this.fadingIn = Math.random() > 0.5;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.fadingIn) {
                    this.opacity += this.fadeSpeed;
                    if (this.opacity >= 0.8) this.fadingIn = false;
                } else {
                    this.opacity -= this.fadeSpeed;
                    if (this.opacity <= 0.1) this.fadingIn = true;
                }

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.save();
                ctx.shadowColor = 'rgba(244, 196, 48, 0.6)';
                ctx.shadowBlur = 8;
                ctx.fillStyle = `rgba(255, 215, 85, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.floor((canvas.width * canvas.height) / 17000);
            const clampedCount = Math.min(Math.max(count, 22), 75);
            for (let i = 0; i < clampedCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            animationFrameId = requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            cancelAnimationFrame(animationFrameId);
            resizeCanvas();
            animate();
        });

        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            animate();
        });
    </script>
</body>
</html>
