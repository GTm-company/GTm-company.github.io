<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Gold_naget and Gtm-company - Разделы</title>
    
    <link rel="canonical" href="https://gtm-company.github.io/all">
    <meta name="description" content="Gold_naget and Gtm-company - Разделы">
    <meta name="theme-color" content="#664900">
    <meta name="color-scheme" content="dark">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23664900'/><text x='50%' y='65%' font-size='55' font-weight='bold' fill='%23F4C430' text-anchor='middle'>G</text></svg>">

    <style>
        :root {
            --bg-color: #664900;
            --text-color: #F4C430;
            --glow-color: rgba(244, 196, 48, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
        }

        #ambient-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .menu-container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            padding: 1rem;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 1.05rem 1.5rem;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 14px;
            text-decoration: none;
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
            cursor: pointer;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.06);
        }

        .action-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .btn-youtube {
            background-color: #FF0000;
            color: #FFFFFF;
            box-shadow: 0 8px 22px rgba(255, 0, 0, 0.35);
        }

        .btn-youtube:hover {
            box-shadow: 0 12px 28px rgba(255, 0, 0, 0.5);
        }

        .btn-net {
            background-color: #38BDF8;
            color: #082F49;
            box-shadow: 0 8px 22px rgba(56, 189, 248, 0.35);
        }

        .btn-net:hover {
            box-shadow: 0 12px 28px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body>

    <canvas id="ambient-canvas"></canvas>

    <main class="menu-container">
        <a href="https://www.youtube.com/@Gold_naget" target="_blank" rel="noopener noreferrer" class="action-btn btn-youtube">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            <span>Youtube</span>
        </a>

        <a href="https://gtm-company.github.io/all/net" class="action-btn btn-net">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="7.5" cy="15.5" r="4.5"/>
                <path d="M10.7 12.3L19.5 3.5"/>
                <path d="M16 7l2.5 2.5"/>
                <path d="M18.5 4.5l2.5 2.5"/>
            </svg>
            <span>Ускоритель интернета</span>
        </a>
    </main>

    <script>
        const canvas = document.getElementById('ambient-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.2 + 0.8;
                this.speedX = (Math.random() - 0.5) * 0.35;
                this.speedY = (Math.random() - 0.5) * 0.35 - 0.15;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.fadeSpeed = 0.003 + Math.random() * 0.004;
                this.fadingIn = Math.random() > 0.5;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.fadingIn) {
                    this.opacity += this.fadeSpeed;
                    if (this.opacity >= 0.75) this.fadingIn = false;
                } else {
                    this.opacity -= this.fadeSpeed;
                    if (this.opacity <= 0.1) this.fadingIn = true;
                }

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.fillStyle = `rgba(244, 196, 48, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.floor((canvas.width * canvas.height) / 18000);
            const clampedCount = Math.min(Math.max(count, 20), 75);
            for (let i = 0; i < clampedCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            animationFrameId = requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            cancelAnimationFrame(animationFrameId);
            resizeCanvas();
            animate();
        });

        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            animate();
        });
    </script>
</body>
</html>
