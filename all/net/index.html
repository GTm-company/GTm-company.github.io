<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Ускоритель интернета - Gtm-company</title>
    
    <link rel="canonical" href="https://gtm-company.github.io/all/net">
    <meta name="description" content="Ускоритель интернета - Gtm-company">
    <meta name="theme-color" content="#1F1600">
    <meta name="color-scheme" content="dark">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23261B00'/><text x='50%' y='66%' font-size='56' font-weight='bold' fill='%23F4C430' text-anchor='middle'>G</text></svg>">

    <style>
        :root {
            --bg-dark: #160F00;
            --gold-main: #F4C430;
            --gold-dim: rgba(244, 196, 48, 0.72);
            --glass-bg: rgba(34, 24, 2, 0.62);
            --glass-border: rgba(244, 196, 48, 0.26);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--gold-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            background:
                radial-gradient(circle at 50% 30%, rgba(56, 189, 248, 0.14) 0%, rgba(244, 196, 48, 0.16) 35%, transparent 72%),
                linear-gradient(160deg, #120C00 0%, #2B1E00 50%, #140E00 100%);
        }

        #ambient-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .glass-card {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 420px;
            padding: 1.85rem 1.4rem;
            border-radius: 26px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: 0 24px 55px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 235, 160, 0.16);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 1.15rem;
        }

        .key-emblem {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            background: rgba(56, 189, 248, 0.14);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: #7DD3FC;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.2);
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #FFF3C4;
            letter-spacing: -0.01em;
        }

        .btn-copy {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            width: 100%;
            padding: 1.1rem 1.5rem;
            font-size: 1.12rem;
            font-weight: 800;
            color: #06253A;
            background: linear-gradient(135deg, #7DD3FC 0%, #38BDF8 55%, #0284C7 100%);
            border: 1px solid rgba(224, 242, 254, 0.65);
            border-radius: 16px;
            box-shadow: 0 10px 26px rgba(56, 189, 248, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.25s ease, color 0.25s ease;
            cursor: pointer;
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            filter: brightness(1.06);
            box-shadow: 0 14px 32px rgba(56, 189, 248, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .btn-copy:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-copy.copied {
            background: linear-gradient(135deg, #4ADE80 0%, #22C55E 60%, #16A34A 100%);
            color: #FFFFFF;
            border-color: rgba(187, 247, 208, 0.7);
            box-shadow: 0 10px 28px rgba(34, 197, 94, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.45);
        }

        .back-link {
            margin-top: 0.15rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--gold-dim);
            text-decoration: none;
            padding: 0.35rem 0.75rem;
            border-radius: 10px;
            transition: color 0.18s ease, background-color 0.18s ease;
        }

        .back-link:hover {
            color: var(--gold-main);
            background-color: rgba(244, 196, 48, 0.1);
        }
    </style>
</head>
<body>

    <canvas id="ambient-canvas"></canvas>

    <main class="glass-card">
        <div class="key-emblem">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="7.5" cy="15.5" r="4.5"/>
                <path d="M10.7 12.3L19.5 3.5"/>
                <path d="M16 7l2.5 2.5"/>
                <path d="M18.5 4.5l2.5 2.5"/>
            </svg>
        </div>

        <h1 class="card-title">Ускоритель интернета</h1>

        <button type="button" id="copyBtn" class="btn-copy">
            <svg id="copyIcon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span id="copyText">нажми чтобы скопировать</span>
        </button>

        <a href="https://gtm-company.github.io/all" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5"/>
                <path d="M12 19l-7-7 7-7"/>
            </svg>
            <span>Назад</span>
        </a>
    </main>

    <script>
        const SUB_URL = 'https://raw.githubusercontent.com/GTm-company/GTm-company.github.io/refs/heads/main/mi-vpn-sub.txt';
        const copyBtn = document.getElementById('copyBtn');
        const copyText = document.getElementById('copyText');
        const copyIcon = document.getElementById('copyIcon');
        const defaultText = 'нажми чтобы скопировать';
        const defaultIconSvg = '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>';
        const checkIconSvg = '<polyline points="20 6 9 17 4 12"/>';
        let resetTimer = null;

        function fallbackCopy(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.top = '-9999px';
            textArea.style.left = '-9999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
            } catch (err) {
                console.error('Ошибка копирования:', err);
            }
            document.body.removeChild(textArea);
        }

        function showCopiedFeedback() {
            copyText.textContent = 'Скопировано!';
            copyIcon.innerHTML = checkIconSvg;
            copyBtn.classList.add('copied');
            clearTimeout(resetTimer);
            resetTimer = setTimeout(() => {
                copyText.textContent = defaultText;
                copyIcon.innerHTML = defaultIconSvg;
                copyBtn.classList.remove('copied');
            }, 2200);
        }

        copyBtn.addEventListener('click', async () => {
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(SUB_URL);
                    showCopiedFeedback();
                    return;
                } catch (err) {
                    fallbackCopy(SUB_URL);
                    showCopiedFeedback();
                    return;
                }
            }
            fallbackCopy(SUB_URL);
            showCopiedFeedback();
        });

        const canvas = document.getElementById('ambient-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.4 + 0.8;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3 - 0.16;
                this.opacity = Math.random() * 0.55 + 0.18;
                this.fadeSpeed = 0.0025 + Math.random() * 0.0035;
                this.fadingIn = Math.random() > 0.5;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.fadingIn) {
                    this.opacity += this.fadeSpeed;
                    if (this.opacity >= 0.8) this.fadingIn = false;
                } else {
                    this.opacity -= this.fadeSpeed;
                    if (this.opacity <= 0.1) this.fadingIn = true;
                }

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.save();
                ctx.shadowColor = 'rgba(244, 196, 48, 0.6)';
                ctx.shadowBlur = 8;
                ctx.fillStyle = `rgba(255, 215, 85, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.floor((canvas.width * canvas.height) / 17000);
            const clampedCount = Math.min(Math.max(count, 22), 75);
            for (let i = 0; i < clampedCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            animationFrameId = requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            cancelAnimationFrame(animationFrameId);
            resizeCanvas();
            animate();
        });

        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            animate();
        });
    </script>
</body>
</html>
