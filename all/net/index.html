<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Ускоритель интернета - GTm-company</title>
    
    <link rel="canonical" href="https://gtm-company.github.io/all/net">
    <meta name="description" content="Ускоритель интернета - GTm-company">
    <meta name="theme-color" content="#664900">
    <meta name="color-scheme" content="dark">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23664900'/><text x='50%' y='65%' font-size='55' font-weight='bold' fill='%23F4C430' text-anchor='middle'>G</text></svg>">

    <style>
        :root {
            --bg-color: #664900;
            --text-color: #F4C430;
            --glow-color: rgba(244, 196, 48, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
        }

        #ambient-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .copy-container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 400px;
            display: flex;
            justify-content: center;
            padding: 1rem;
        }

        .btn-copy {
            width: 100%;
            padding: 1.05rem 1.75rem;
            font-size: 1.15rem;
            font-weight: 700;
            color: #082F49;
            background-color: #38BDF8;
            border: none;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.35);
            transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.2s ease, color 0.2s ease;
            cursor: pointer;
        }

        .btn-copy:hover {
            background-color: #7DD3FC;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(56, 189, 248, 0.5);
        }

        .btn-copy:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-copy.copied {
            background-color: #22C55E;
            color: #FFFFFF;
            box-shadow: 0 8px 24px rgba(34, 197, 94, 0.45);
        }
    </style>
</head>
<body>

    <canvas id="ambient-canvas"></canvas>

    <main class="copy-container">
        <button type="button" id="copyBtn" class="btn-copy">нажми чтобы скопировать</button>
    </main>

    <script>
        const SUB_URL = 'https://raw.githubusercontent.com/GTm-company/GTm-company.github.io/refs/heads/main/mi-vpn-sub.txt';
        const copyBtn = document.getElementById('copyBtn');
        const defaultText = 'нажми чтобы скопировать';
        let resetTimer = null;

        function fallbackCopy(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.top = '-9999px';
            textArea.style.left = '-9999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
            } catch (err) {
                console.error('Ошибка копирования:', err);
            }
            document.body.removeChild(textArea);
        }

        function showCopiedFeedback() {
            copyBtn.textContent = 'Скопировано!';
            copyBtn.classList.add('copied');
            clearTimeout(resetTimer);
            resetTimer = setTimeout(() => {
                copyBtn.textContent = defaultText;
                copyBtn.classList.remove('copied');
            }, 2000);
        }

        copyBtn.addEventListener('click', async () => {
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(SUB_URL);
                    showCopiedFeedback();
                    return;
                } catch (err) {
                    fallbackCopy(SUB_URL);
                    showCopiedFeedback();
                    return;
                }
            }
            fallbackCopy(SUB_URL);
            showCopiedFeedback();
        });

        const canvas = document.getElementById('ambient-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.2 + 0.8;
                this.speedX = (Math.random() - 0.5) * 0.35;
                this.speedY = (Math.random() - 0.5) * 0.35 - 0.15;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.fadeSpeed = 0.003 + Math.random() * 0.004;
                this.fadingIn = Math.random() > 0.5;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.fadingIn) {
                    this.opacity += this.fadeSpeed;
                    if (this.opacity >= 0.75) this.fadingIn = false;
                } else {
                    this.opacity -= this.fadeSpeed;
                    if (this.opacity <= 0.1) this.fadingIn = true;
                }

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.fillStyle = `rgba(244, 196, 48, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.floor((canvas.width * canvas.height) / 18000);
            const clampedCount = Math.min(Math.max(count, 20), 75);
            for (let i = 0; i < clampedCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            animationFrameId = requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            cancelAnimationFrame(animationFrameId);
            resizeCanvas();
            animate();
        });

        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            animate();
        });
    </script>
</body>
</html>
